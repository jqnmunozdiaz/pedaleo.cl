name: Despliegue en GitHub Pages y Actualización Automática

on:
  push:
    branches:
      - main
  schedule:
    # Corre todos los días a las 06:00 UTC (03:00 hora de Chile)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages y hacer commit de datos actualizados
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Ejecutar sincronización de carreras
        run: |
          python scripts/sync_events.py

      - name: Validar integridad de datos
        run: |
          python scripts/validate_events.py

      - name: Guardar cambios si hay carreras nuevas
        run: |
          git config --local user.email "bot@pedaleo.cl"
          git config --local user.name "PedaleoBot"
          if ! git diff --quiet data/events.json; then
            echo "Se detectaron nuevas carreras o actualizaciones."
            git add data/events.json
            git commit -m "[auto] Actualizar calendario de carreras [skip ci]"
            git push
          else
            echo "No hay cambios nuevos en el calendario hoy."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
