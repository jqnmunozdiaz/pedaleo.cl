name: Sincronización Automática del Calendario

on:
  schedule:
    # Ejecutar todos los días a las 06:00 UTC (03:00 hora de Chile)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub Actions
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Ejecutar sincronización de carreras
        run: |
          python scripts/sync_events.py

      - name: Validar integridad de datos
        run: |
          python scripts/validate_events.py

      - name: Comprobar cambios y hacer commit
        run: |
          git config --local user.email "bot@pedaleo.cl"
          git config --local user.name "PedaleoBot"
          if ! git diff --quiet data/events.json; then
            echo "Se detectaron nuevas carreras o actualizaciones."
            git add data/events.json
            git commit -m "[auto] Actualizar calendario de carreras [skip ci]"
            git push
          else
            echo "No hay carreras nuevas para actualizar hoy."
          fi
